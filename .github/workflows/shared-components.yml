name: Shared component release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  shared-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:shared
      - run: npm run build
      - run: npm run verify:release
