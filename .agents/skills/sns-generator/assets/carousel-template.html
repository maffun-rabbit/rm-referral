<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920,initial-scale=1">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
body {
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  background: #d8d0c5;
  position: relative;
}
.photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}
.panel {
  position: absolute;
  left: 88px;
  right: 88px;
  top: 188px;
  bottom: 188px;
  border-radius: 44px;
  background: rgba(255,255,255,.60);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 112px 64px;
}
.text {
  width: 100%;
  color: #5c3300;
  background: none;
  font-size: 108px;
  font-weight: 900;
  line-height: 1.5;
  letter-spacing: .005em;
  text-align: center;
  white-space: pre-line;
  word-break: keep-all;
  overflow-wrap: normal;
}
</style>
</head>
<body>
  <img id="backgroundPhoto" class="photo" alt="">
  <main class="panel"><div id="slideText" class="text"></div></main>
  <script>
    const p = new URLSearchParams(location.search);
    const photo = document.getElementById('backgroundPhoto');
    photo.src = p.get('background') || '';
    photo.style.objectPosition = p.get('position') || 'center';
    const el = document.getElementById('slideText');
    el.textContent = p.get('text') || '';
    let size = Number(p.get('size') || 108);
    el.style.fontSize = `${size}px`;
    while ((el.scrollHeight > 1280 || el.scrollWidth > el.clientWidth) && size > 64) {
      size -= 2;
      el.style.fontSize = `${size}px`;
    }
    document.documentElement.dataset.ready = 'true';
  </script>
</body>
</html>
